<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社内統合管理システム</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        header {
            color: black;
            /* 背景色を削除し、文字色を黒に設定 */
            padding: 10px;
            text-align: center;
        }

        header .main-header {
            font-size: 2em;
            /* フォントサイズを2倍に */
        }

        header .sub-header {
            display: flex;
            justify-content: space-between;
            /* 左寄せと右寄せを実現 */
            font-size: 14px;
            padding-right: 10px;
            padding-left: 10px;
        }

        .sub-header .left-side {
            text-align: left;
        }

        .sub-header .right-side {
            text-align: right;
        }

        .container {
            padding: 20px;
        }

        /* 銀色の金属リボン */
        .ribbon {
            background: linear-gradient(145deg, #d1d1d1, #e6e6e6); /* 銀色のグラデーション */
            border-radius: 5px; /* 丸みを帯びた角 */
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #333; /* 文字色を濃くして目立たせる */
            text-shadow: 1px 1px 5px rgba(255, 255, 255, 0.8); /* 反射感を出すための光沢感 */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1), inset 0 1px 5px rgba(255, 255, 255, 0.6); /* 光沢感と深み */
            margin-bottom: 20px;
        }

        .search-condition {
            display: flex;
            flex-direction: column;
            /* 要素を縦に並べる */
            align-items: center;
            /* 中央寄せ */
            margin-bottom: 20px;
        }

        .section-title {
            text-align: left;
            /* 「■検索条件」を左寄せ */
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            width: 100%;
            /* 見出しを中央寄せにしない */
        }

        .search-form {
            width: 80%;
            /* 幅を80%に設定して中央寄せ */
        }

        .search-form label {
            margin-right: 10px;
        }

        .search-form input,
        .search-form select {
            padding: 5px;
            margin-right: 10px;
            margin-bottom: 15px;
            /* 各要素の間隔を広げる */
        }

        .search-form button {
            padding: 10px 20px;
            background-color: #BDD7EE;
            /* 背景色を#BDD7EEに変更 */
            color: black;
            border: none;
            cursor: pointer;
            margin-top: 20px;
            /* ボタンの上に余白を追加 */
        }

        .search-form button:hover {
            background-color: #A1C4D4;
            /* ホバー時に少し暗く */
        }

        .employee-table {
            width: 100%;
            border-collapse: collapse;
            /* ボーダーを崩さない */
            margin-top: 20px;
        }

        .employee-table th,
        .employee-table td {
            border: 1px solid #ddd;
            /* セルの境界線 */
            padding: 8px;
            text-align: center;
        }

        .employee-table th {
            background-color: #BDD7EE;
            /* ヘッダーの背景色 */
            color: black;
            /* 文字色を黒に設定 */
        }

        .employee-table td {
            background-color: #f9f9f9;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .right-align {
            text-align: right;
            /* 右寄せ用クラス */
            margin-bottom: 10px;
        }

        .spaced {
            margin-right: 20px;
            /* 要素の間隔を広げる */
        }
    </style>
</head>

<body>
    <!-- ヘッダー -->
    <header>
        <div class="main-header">社内統合管理システム</div>
        </br>
        <div class="sub-header">
            <div class="left-side">
                登録日時：<a id="timestamp"></a>
            </div>
            <div class="right-side">
                ユーザー名：XXXX <span class="spaced"></span><span class="spaced">権限：XX</span>
                <button>ログアウト</button>
            </div>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <div class="container">
        <!-- リボン -->
        <div class="ribbon">社員管理</div>

        <!-- 検索条件セクション -->
        <div class="search-condition">
            <div class="section-title">■検索条件</div>
            <div class="search-form">
			<form id="searchForm" th:action="@{/syainmanagement}" method="get">
			<!-- 1行目: 所属会社と社員名 -->
			    <div class="row">
			        <label for="company">所属会社</label>	
			        <select id="company" name="syozokuKaisya">
			            <option value="">全て</option>
			            <option value="111" th:text="${kaisha1}">会社B</option>
			            <option value="121" th:text="${kaisha2}">会社C</option>
			        </select>

			        <label for="employee-name">社員名</label>
			        <input type="text" id="employee-name" name="syainName" placeholder="社員名">
			    </div>

				<!-- 2行目: 職業種類と在職/非在職 -->
			    <div class="row">
			        <label for="job-type">職業種類</label>
			        <select id="job-type" name="syokugyoKind">
			            <option value="">全て</option>
			            <option value="341" th:text="${shokugyo1}">職業A</option>
			            <option value="342" th:text="${shokugyo2}">職業B</option>
			            <option value="343" th:text="${shokugyo3}">職業C</option>
						<option value="344" th:text="${shokugyo4}">職業C</option>
						<option value="345" th:text="${shokugyo5}">職業C</option>
						<option value="346" th:text="${shokugyo6}">職業C</option>
			        </select>

			        <label for="active">在職</label>
			        <input type="checkbox" id="active" name="zaiseki" checked>

			        <label for="inactive">非在職</label>
			        <input type="checkbox" id="inactive" name="hizaiseki">
			    </div>

				<!-- 3行目: 検索ボタン -->
			    <div class="row">
			        <button type="submit">検索</button>
			    </div>
			</form>
            </div>
        </div>

        <!-- 社員一覧セクション -->
        <div class="employee-list">
            <div class="section-title">■社員一覧</div> <!-- ここを左寄せのスタイルに変更 -->
            <div class="right-align">
                件数：<a th:text="${syainListSize}"> 0 </a> 件 <span class="spaced"></span><a href="/syainRegist">新規登録</a>
            </div>

            <!-- テーブル -->
            <table class="employee-table" th:if="${syainList}">
                <thead>
                    <tr>
                        <th>所属会社</th>
                        <th>社員名</th>
                        <th>性別</th>
                        <th>職業種類</th>
                        <th>入社日</th>
                        <th>退社日</th>
<!--                        <th>職務経歴書</th>-->
                        <th>編集</th>
                    </tr>
                </thead>
					<tbody>
					    <tr th:each="syain : ${syainList}">
							<td>
								<span th:switch="${syain.syozokuKaisya}">
							    	<span th:case="111" th:text="${kaisha1}">（株）ブライトスター</span>
							    	<span th:case="121" th:text="${kaisha2}">（株）トップクラウド</span>
								</span>
							</td>
					        <td>
					            <span th:text="${syain.lastNameKanji}">姓</span> &nbsp;
					            <span th:text="${syain.firstNameKanji}">名</span>
					        </td>
					        <td>
					            <span th:switch="${syain.seibetu}">
					                <span th:case="1">男性</span>
					                <span th:case="2">女性</span>
					            </span>
					        </td>
					        <td>
								<span th:switch="${syain.syokugyoKind}">
									<span th:case="341" th:text="${shokugyo1}"></span>
									<span th:case="342" th:text="${shokugyo2}"></span>
									<span th:case="343" th:text="${shokugyo3}"></span>
									<span th:case="344" th:text="${shokugyo4}"></span>
									<span th:case="345" th:text="${shokugyo5}"></span>
									<span th:case="346" th:text="${shokugyo6}"></span>
								</span>
							</td>
					        <td th:text="${#dates.format(syain.nyuusyaDate, 'yyyy年M月d日')}">入社日</td>
					        <td th:text="${#dates.format(syain.taisyaDate, 'yyyy年M月d日')}">退社日</td>
<!--					        <td><a href="#">登録</a></td>-->
					        <td>
								<a th:href="@{'/update/' + ${syain.syainId}}">更新</a> <br>
								<a th:href="@{'/delete/' + ${syain.syainId}}"
								       th:data-employee-name="|${syain.lastNameKanji} ${syain.firstNameKanji}|"
								        onclick="return confirm(this.getAttribute('data-employee-name') + 'を削除してもよろしいですか？');">削除</a>
							</td>
					    </tr>
					</tbody>
            </table>
        </div>
    </div>
		<!--								<td><a href="${syain.resumePath}">職務経歴書</a></td>-->
		<!--								<td><a href="/syain/edit/${syain.syainId}">編集</a></td>-->

    <!-- フッター -->
    <div class="footer">
        <p>&copy; 2024 社内統合管理システム</p>
    </div>
</body>
	<script>
		const now = new Date();
		const formatted = now.getFullYear() + "年" +
		                  String(now.getMonth() + 1).padStart(2, '0') + "月" +
		                  String(now.getDate()).padStart(2, '0') + "日 " +
		                  String(now.getHours()).padStart(2, '0') + "時" +
		                  String(now.getMinutes()).padStart(2, '0') + "分" +
		                  String(now.getSeconds()).padStart(2, '0') + "秒";
		document.getElementById("timestamp").textContent = formatted;
		
	    document.getElementById("searchForm").addEventListener("submit", function(event) {
	        const zaiseki = document.getElementById("active").checked;
	        const hizaiseki = document.getElementById("inactive").checked;

	        if (!zaiseki && !hizaiseki) {
	            alert("在籍と非在籍がいずれにしても、１つのチェックが必須です。");
	            event.preventDefault(); 
	        }
	    });
	</script>

</html>
