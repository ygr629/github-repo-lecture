<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>社内統合管理システム</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
    }
	
	td {
	  vertical-align: top;
	}

    header {
        color: black;
        /* 背景色を削除し、文字色を黒に設定 */
        padding: 10px;
        text-align: center;
    }

    header .main-header {
        font-size: 2em;
        /* フォントサイズを2倍に */
    }

    header .sub-header {
        display: flex;
        justify-content: space-between;
        /* 左寄せと右寄せを実現 */
        font-size: 14px;
        padding-right: 10px;
        padding-left: 10px;
    }

    .sub-header .left-side {
        text-align: left;
    }

    .sub-header .right-side {
        text-align: right;
    }

    .container {
        padding: 20px;
    }

    /* 銀色の金属リボン */
    .ribbon {
        background: linear-gradient(145deg, #d1d1d1, #e6e6e6); /* 銀色のグラデーション */
        border-radius: 5px; /* 丸みを帯びた角 */
        padding: 15px;
        font-size: 18px;
        font-weight: bold;
        color: #333; /* 文字色を濃くして目立たせる */
        text-shadow: 1px 1px 5px rgba(255, 255, 255, 0.8); /* 反射感を出すための光沢感 */
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1), inset 0 1px 5px rgba(255, 255, 255, 0.6); /* 光沢感と深み */
        margin-bottom: 20px;
    }

    .search-condition {
        display: flex;
        flex-direction: column;
        /* 要素を縦に並べる */
        align-items: center;
        /* 中央寄せ */
        margin-bottom: 20px;
    }

    .section-title {
        text-align: left;
        /* 「■検索条件」を左寄せ */
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 10px;
        width: 100%;
        /* 見出しを中央寄せにしない */
    }

    .search-form {
        width: 80%;
        /* 幅を80%に設定して中央寄せ */
    }

    .search-form label {
        margin-right: 10px;
    }

    .search-form input,
    .search-form select {
        padding: 5px;
        margin-right: 10px;
        margin-bottom: 15px;
        /* 各要素の間隔を広げる */
    }

    .search-form button {
        padding: 10px 20px;
        background-color: #BDD7EE;
        /* 背景色を#BDD7EEに変更 */
        color: black;
        border: none;
        cursor: pointer;
        margin-top: 20px;
        /* ボタンの上に余白を追加 */
    }

    .search-form button:hover {
        background-color: #A1C4D4;
        /* ホバー時に少し暗く */
    }

    .employee-table {
        width: 100%;
        border-collapse: collapse;
        /* ボーダーを崩さない */
        margin-top: 20px;
    }

    .employee-table th,
    .employee-table td {
        border: 1px solid #ddd;
        /* セルの境界線 */
        padding: 8px;
        text-align: center;
    }

    .employee-table th {
        background-color: #BDD7EE;
        /* ヘッダーの背景色 */
        color: black;
        /* 文字色を黒に設定 */
    }

    .employee-table td {
        background-color: #f9f9f9;
    }

    .footer {
        text-align: center;
        margin-top: 20px;
        font-size: 14px;
    }

    .right-align {
        text-align: right;
        /* 右寄せ用クラス */
        margin-bottom: 10px;
    }

    .spaced {
        margin-right: 20px;
        /* 要素の間隔を広げる */
    }
		.tech-table {
		  border-collapse: collapse;
		  width: 100%;
		  table-layout: fixed;
		}

		.tech-table th,
		.tech-table td {
		  border: 1px solid #aaa;
		  padding: 6px;
		  text-align: center;
		  vertical-align: middle;
		}

		.tech-table th {
		  background-color: #d4f2f9;
		  width: 50px;
		}

		.highlight {
		  background-color: yellow;
		}

		.tech-table td span {
		  display: block;
		  font-weight: bold;
		  margin-bottom: 4px;
		}

		.note {
		  font-size: 13px;
		}

		input[type="radio"] {
		  margin: 0 3px;
		}
	  .tech-table {
	      border-collapse: collapse;
	      margin: 20px 0;
	      width: 100%;
	      border: 2px solid #333;
	  }

	  .tech-table th, .tech-table td {
	      border: 1px solid #333;
	      padding: 4px 6px;
	      text-align: center;
	      vertical-align: middle;
	      height: 35px;
	      white-space: nowrap;
	      overflow: hidden;
	      text-overflow: ellipsis;
	  }

	  .tech-table th {
	      background-color: #f0f0f0;
	      font-weight: bold;
	  }

	  .os-select {
	      width: 60px;
	      height: 25px;
	      text-align: center;
	      border: 1px solid #ccc;
	      background-color: white;
	      font-size: 12px;
	  }

	  .table-container {
	      overflow-x: auto;
	  }

	  .table-title {
	      font-size: 16px;
	      font-weight: bold;
	      margin-bottom: 10px;
	      color: #333;
	  }

	  .row-header {
	      background-color: #e0e0e0;
	      font-weight: bold;
	      writing-mode: horizontal-tb;
	      width: 60px;
	      min-width: 60px;
	  }

	  .os-name {
	      background-color: #f8f9fa;
	      font-weight: bold;
	      font-size: 12px;
	      white-space: nowrap;
	      overflow: hidden;
	      text-overflow: ellipsis;
	      max-width: 100px;
	      width: 100px;
	  }

	  .select-cell {
	      background-color: white;
	      width: 70px;
	      max-width: 70px;
	  }

	  /* 데모용 스타일 */
	  .demo-section {
	      border: 2px dashed #007bff;
	      padding: 20px;
	      margin: 20px 0;
	      background-color: #f8f9fa;
	  }

	  .demo-title {
	      color: #007bff;
	      font-size: 18px;
	      font-weight: bold;
	      margin-bottom: 15px;
	  }
</style>

</head>
<body>
<header>
    <div class="main-header">社内統合管理システム</div>
    </br>
    <div class="sub-header">
        <div class="left-side">
            登録日時：<a id="timestamp"></a>
        </div>
        <div class="right-side">
            ユーザー名：XXXX <span class="spaced"></span><span class="spaced">権限：XX</span>
            <button>ログアウト</button>
        </div>
    </div>
</header>

<!-- メインコンテンツ -->
    <div class="container">
        <!-- リボン -->
        <div class="ribbon">社員登録</div>

        <!-- 検索条件セクション -->
        <div class="regist-condition">
				<form id="registForm" th:action="@{/syainRegist}" method="post">
					<div class="section-title">■基本情報</div>
					<table>
						<!-- 社員コード -->
						<tr>
					    	<td><label for="company">社員コード</label></td>	
							<td><input type="text" id="employee-Code" name="employeeCode"></td>
						</tr>
						<!-- 社員名 -->
						<tr>
							<td><label>社員名（漢字）</label></td>
							<td>
								<label for="employee-Lastname">姓</label>
						        <input type="text" id="lastNameKanji" name="lastNameKanji">
								<label for="employee-Firstname">名</label>
								<input type="text" id="firstNameKanji" name="firstNameKanji">
							</td>
						</tr>
						<!-- 性別 -->
						<tr>
							<div class="row">
								<td> <label>性別</label> </td>
								<td>
									<input type="radio" id="seibetsu-male" name="seibetu" value="1">
									<label for="seibetsu-male">男</label>
						
									<input type="radio" id="seibetsu-female" name="seibetu" value="2">
									<label for="seibetsu-female">女</label>
								</td>
							</div>
						</tr>
					</table>
					<div class="section-title">■会社関連情報</div>
					<table>
						<!-- 会社 -->
						<tr>
					    	<td><label for="company">所属会社</label></td>	
							<td>
								<select id="company" name="syozokuKaisya">
								    <option value="111" th:text="${kaisha1}">会社B</option>
								    <option value="121" th:text="${kaisha2}">会社C</option>
								</select>
							</td>
						</tr>
						<!-- 入社日 -->
						<tr>
						  <td style="vertical-align: middle;"><label for="nyuusyaDate">入社日</label></td>
						  <td>
						    <input type="date" id="nyuusyaDate" name="nyuusyaDate">
						  </td>
						</tr>
					  <!-- 退社日 -->
						<tr>
						  <td style="vertical-align: middle;"><label for="taisyaDate">退社日</label></td>
						  <td>
						  	<input type="date" id="taisyaDate" name="taisyaDate">
						    <span style="margin-left: 10px; font-size: 12px; color: gray;">※YYYY-MM-DD</span>
						  </td>
						</tr>
						<!--職業 -->
						<tr>
							<td><label>職業種類</label></td>
							<td>
								<select id="job-type" name="syokugyoKind">
								    <option value="341" th:text="${shokugyo1}">職業A</option>
								    <option value="342" th:text="${shokugyo2}">職業B</option>
								    <option value="343" th:text="${shokugyo3}">職業C</option>
									<option value="344" th:text="${shokugyo4}">職業C</option>
									<option value="345" th:text="${shokugyo5}">職業C</option>
									<option value="346" th:text="${shokugyo6}">職業C</option>
								</select>
							</td>
						</tr>
					</table>

					<!-- 銀行 -->
					<div class="section-title">■給与関連情報</div>
										<table class="tech-table">
										  <tr>
											<td>金融機関コード</td>
											<td>金融機関名</td>
											<td>支店名コード</td>
											<td>支店名</td>
											<td>口座種類</td>
											<td>口座番号</td>
											<td>名義人</td>
										  </tr>
										  <tr>
											<td><input type="tel" id="bank_code" name="kinyukikanCode"></td>
											<td><input type="tel" id="bank_name" name="kinyukikanName"></td>
											<td><input type="tel" id="branch_code" name="sitenCode"></td>
											<td><input type="tel" id="branch_name" name="sitenName"></td>
											<td><input type="tel" id="account_type" name="kouzaKind"></td>
											<td><input type="tel" id="account_number" name="kouzaNum"></td>
											<td><input type="tel" id="account_holder" name="meigiName"></td>
										  </tr>	
										</table>
					
					<!-- OS -->
					<div class="section-title">■技術経験</div>
					<input type="hidden" id="osInput" name="itOs">
					<div class="note right-align"> ◎：実務経験1年以上　／　○：実務経験有り　／　△：知識有り </div>
					<div class="table-container">
					    <table class="tech-table">
					        <!-- 5개씩 그룹으로 나누어 각 행 생성 -->
					        <th:block th:each="rowIndex : ${#numbers.sequence(0, (osList.size() - 1) / 5)}">
					            <tr>
					                <!-- 첫 번째 행에만 OS 헤더 표시 (rowspan 적용) -->
					                <!-- Math.ceil 대신 정수 나눗셈 사용: (size + 4) / 5 -->
					                <th class="row-header" th:if="${rowIndex == 0}" 
					                    th:attr="rowspan=${(osList.size() + 4) / 5}">OS</th>
					                
					                <!-- 현재 행의 5개 OS 표시 (OS명-선택-OS명-선택 패턴) -->
					                <th:block th:each="os, iterStat : ${osList}" 
					                          th:if="${iterStat.index >= rowIndex * 5 && iterStat.index < (rowIndex + 1) * 5}">
					                    <!-- OS명 셀 -->
					                    <th class="os-name" th:text="${os.name}">OS명</th>
					                    <!-- 선택 드롭다운 셀 -->
					                    <td class="select-cell">
					                        <select th:attr="data-os-id=${os.id}" class="os-select">
					                            <option value=""></option>
					                            <option value="1">◎</option>
					                            <option value="2">○</option>
					                            <option value="3">△</option>
					                        </select>
					                    </td>
					                </th:block>
					            </tr>
					        </th:block>
					    </table>
					</div>
					<div align="center"><button onclick="packOS()">登録</button></div>
					
				</form>
        </div>

</body>
<script>
	const now = new Date();
	const formatted = now.getFullYear() + "年" +
	                  String(now.getMonth() + 1).padStart(2, '0') + "月" +
	                  String(now.getDate()).padStart(2, '0') + "日 " +
	                  String(now.getHours()).padStart(2, '0') + "時" +
	                  String(now.getMinutes()).padStart(2, '0') + "分" +
	                  String(now.getSeconds()).padStart(2, '0') + "秒";
	document.getElementById("timestamp").textContent = formatted;

	function packOS() {
	    let osData = [];
	    document.querySelectorAll('.os-select').forEach(select => {
	        const osId = select.dataset.osId;
	        const level = select.value;

	        if (level) {
	            osData.push(`${osId}-${level}`);
	        }
	    });

	    document.getElementById('osInput').value = osData.join(',');
	    document.querySelector('registForm').submit();
	}
	
</script>
</html>
